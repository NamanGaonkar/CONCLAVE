<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conclave</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0B0D17; color: #F8FAFC;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 56px; height: 56px;
        background: linear-gradient(135deg, #00F2FE, #6366F1); color: #FFFFFF;
        border-radius: 14px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800; font-size: 24px;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      }
      #cth-splash .title {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700; font-size: 15px; letter-spacing: 2px;
        color: #F8FAFC;
      }
      #cth-splash .hint { font-size: 13px; color: #94A3B8; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">C</div>
        <div class="title">CONCLAVE</div>
        <div class="hint">Loading workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
