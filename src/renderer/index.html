<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conclave</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com https://api.github.com; media-src 'self' blob: mediastream:;" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #FFFDF5; color: #1A1320;
        font-family: "Lato", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 64px; height: 64px;
        background: linear-gradient(135deg, #F5AF28, #FFD15C); color: #1A1320;
        border-radius: 14px;
        font-family: "Press Start 2P", monospace;
        font-size: 26px;
        box-shadow: 0 8px 24px rgba(245, 175, 40, 0.35);
      }
      #cth-splash .title {
        font-family: "Press Start 2P", monospace;
        font-size: 13px; letter-spacing: 2px;
        color: #1A1320;
      }
      #cth-splash .hint { font-size: 12px; color: #6B5878; }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #FFFDF5; color: #1A1320; overflow: hidden;">
    <div id="root">
      <div id="cth-splash">
        <div class="mk">C</div>
        <div class="title">CONCLAVE</div>
        <div class="hint">Loading workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
